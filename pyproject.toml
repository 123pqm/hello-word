[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pymysql[rsa]>=1.1.1,<2",
    "pytest>=9.1.1",
    "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["mysql: integration tests using a disposable MySQL database"]
